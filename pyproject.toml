# Lint and format configuration for the repository's Python (#822). Tool
# configuration only: nothing here is packaged.

[tool.ruff]
target-version = "py312"
extend-exclude = [
    # Generated protobuf, vendored from aioesphomeapi.
    "controller/esphome/vendor",
    "GoTinyAlsa",
]

[tool.ruff.lint]
# The full pyflakes set. Undefined names were the only check until #822;
# they are still the reason this job exists (see ci.yml).
select = ["F"]

[tool.mypy]
# A RATCHET (tools/hygiene/baseline/mypy.txt, #822), starting with the
# controller's pure-logic modules: those importing nothing beyond the
# standard library, numpy and scipy, so this needs no aiohttp, websockets
# or openwakeword. Widen the list as modules are typed; the ratchet holds
# whatever a newly added module brings.
python_version = "3.12"
mypy_path = "controller"
ignore_missing_imports = true
files = [
    "controller/em_announce.py",
    "controller/em_arbiter.py",
    "controller/em_barge.py",
    "controller/em_ble_gatt.py",
    "controller/em_ble_health.py",
    "controller/em_broadcast.py",
    "controller/em_button.py",
    "controller/em_cacerts.py",
    "controller/em_config_sections.py",
    "controller/em_config_types.py",
    "controller/em_console_pw.py",
    "controller/em_dbwriter.py",
    "controller/em_earlytts.py",
    "controller/em_emos_build.py",
    "controller/em_endpoints.py",
    "controller/em_firmware.py",
    "controller/em_health.py",
    "controller/em_hostip.py",
    "controller/em_ingressauth.py",
    "controller/em_labels.py",
    "controller/em_limiter.py",
    "controller/em_linkauth.py",
    "controller/em_listen.py",
    "controller/em_loglevel.py",
    "controller/em_output_mute.py",
    "controller/em_oww_models.py",
    "controller/em_oww_warmup.py",
